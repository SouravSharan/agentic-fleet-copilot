# Secret scanning (CI job "gitleaks"). Default rules plus a narrow allowlist for values that are
# public by design: dev-only placeholder keys in .env.example / CI, and content hashes used as
# cassette keys in recorded evals. Real keys live only in untracked .env files.
title = "fleet-copilot gitleaks config"

[extend]
useDefault = true

[allowlist]
description = "Public dev placeholder keys and eval content hashes"
paths = [
  '''^evals/cassettes/''',
  '''^evals/reports/''',
]
regexes = [
  '''0123456789abcdef0123456789abcdef(0123456789abcdef0123456789abcdef)?''',
  '''fedcba9876543210fedcba9876543210fedcba9876543210fedcba9876543210''',
  '''a1b2c3d4e5f60718293a4b5c6d7e8f90a1b2c3d4e5f60718293a4b5c6d7e8f90''',
]
