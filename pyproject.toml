[project]
name = "agentic-fleet-copilot"
version = "0.1.0"
description = "Agentic AI Fleet Copilot over device telemetry"
requires-python = ">=3.12"
dependencies = [
    "pandas>=2.2",
    "numpy>=2.0",
    "psycopg[binary,pool]>=3.2",
    "pydantic>=2.10",
    "pydantic-settings>=2.7",
    "typer>=0.15",
]

[dependency-groups]
dev = [
    "ipykernel>=6.29",
    "matplotlib>=3.9",
    "pytest>=8.3",
    "pytest-asyncio>=0.25",
    "ruff>=0.9",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/fleet_copilot"]

[tool.pytest.ini_options]
testpaths = ["tests"]
asyncio_mode = "auto"
asyncio_default_fixture_loop_scope = "function"

[tool.ruff]
line-length = 100
target-version = "py312"

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B"]
