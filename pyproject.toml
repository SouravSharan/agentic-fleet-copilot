[project]
name = "agentic-fleet-copilot"
version = "0.1.0"
description = "Agentic AI Fleet Copilot over device telemetry"
requires-python = ">=3.12"
dependencies = [
    "fastapi>=0.115",
    "langchain>=1,<2",
    "langchain-core>=0.3",
    "langchain-google-genai>=2.1",
    "langgraph>=1.2.24,<1.3",
    "langgraph-checkpoint-postgres>=3.2,<4",
    "markdown-it-py>=4.0,<5",
    "numpy>=2.0",
    "psycopg[binary,pool]>=3.2",
    "pycryptodome>=3.20",
    "pydantic>=2.10",
    "pydantic-settings>=2.7",
    "pyjwt>=2.9",
    "pyyaml>=6.0",
    "rich>=13.9",
    "sqlglot>=25.0",
    "streamlit>=1.45",
    "typer>=0.15",
    "uvicorn>=0.32",
]

[project.scripts]
fleet-copilot = "fleet_copilot.interfaces.cli:app"

[dependency-groups]
dev = [
    "playwright>=1.50",
    "pyright>=1.1.390",
    "pytest>=8.3",
    "pytest-cov>=6.0",
    "ruff>=0.9",
]
eda = [
    "ipykernel>=6.29",
    "matplotlib>=3.9",
    "pandas>=2.2",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/fleet_copilot"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-ra --strict-markers"
markers = [
    "unit: pure unit tests (no database, no LLM)",
    "integration: tests requiring PostgreSQL (test database)",
    "graph: LangGraph workflow tests with scripted chat model",
    "api: FastAPI endpoint and auth tests",
    "ui: Streamlit AppTest smoke tests",
    "eval: evaluation suite and oracle verification tests",
    "live: opt-in tests making live LLM calls (excluded from make test and CI)",
]

[tool.pyright]
include = ["src", "scripts", "evals"]
typeCheckingMode = "basic"
pythonVersion = "3.12"

[tool.ruff]
line-length = 100
target-version = "py312"
extend-exclude = ["notebooks"]

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B"]
