# QA evaluation cases (24 cases): 3 brief examples x 3 tenants, overviews, lookups, desktops, employees, filters.

- id: qa-acme-low-disk
  tenant: acme-001
  role: it_admin
  turns:
    - user: "Which devices at Acme are low on disk space?"
  expect:
    device_set: [8NM23J95R5I6, MT7PJB7N5LRE]
    oracle_ref:
      fn: low_disk
      args: {company: acme-001}
    count: 2
    must_call: [find_devices]
    must_not_mention: [E4V0SB5I0MYU, JRZSGXVMKE6M, DARFCP0BQM2G, RLD7WV7J82SH]
    citations: required
    mentions_threshold: true
  tags: [qa, example, reviewer, core]

