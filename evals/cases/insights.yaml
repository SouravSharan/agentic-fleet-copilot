# Proactive 30-day trend & insight cases (10 cases).

- id: ins-acme-battery
  tenant: acme-001
  role: it_admin
  turns:
    - user: "Analyze 30-day battery degradation and end-of-life trends across our fleet."
  expect:
    device_set: [7VP16KHV88LM, 8NM23J95R5I6, M4XVHUV1MEPZ]
    oracle_ref:
      fn: battery_eol
      args: {company: acme-001}
    count: 3
    must_call: [analyze_fleet_trends]
    citations: required
  tags: [insights, battery]

