[client]
showErrorDetails = "none"
toolbarMode = "viewer"

[browser]
gatherUsageStats = false

[theme]
base = "light"
primaryColor = "#2563EB"
font = "Inter:https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&display=swap"
baseRadius = "0.5rem"
buttonRadius = "0.5rem"
showWidgetBorder = true
showSidebarBorder = true
redColor = "#DC2626"
orangeColor = "#D97706"
blueColor = "#2563EB"
greenColor = "#059669"
grayColor = "#64748B"
chartCategoricalColors = [
    "#2563EB",
    "#D97706",
    "#DC2626",
    "#059669",
    "#7C3AED",
    "#0891B2",
    "#4B5563",
]

[theme.light]
backgroundColor = "#FFFFFF"
secondaryBackgroundColor = "#F8FAFC"
textColor = "#0F172A"
borderColor = "#E2E8F0"

[theme.dark]
backgroundColor = "#0F172A"
secondaryBackgroundColor = "#1E293B"
textColor = "#F8FAFC"
borderColor = "#334155"
primaryColor = "#3B82F6"
